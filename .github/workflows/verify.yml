name: Verify Build & Prisma

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      SESSION_SECRET: ci-build-only-secret-not-for-production-0123456789

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Prisma validate
      run: npx prisma validate

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Type check
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm run test:unit

    - name: Build project
      run: npm run build
